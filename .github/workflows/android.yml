name: android
on:
  pull_request:
  push:
    branches:
      - master
      - fix-ci-linux
  workflow_dispatch:

jobs:
  # Stage 1: Haxe -> C. Cheap, and both downstream jobs need out/, so run it once
  # and share the result rather than repeating it per job.
  haxe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-${{ hashFiles('Makefile', 'config/*.hxml') }}

      - name: Install Haxe libraries
        run: make init

      - name: Generate C sources
        run: make demo-c

      - name: Check generated sources
        run: |
          test -f out/main.c || { echo "out/main.c was not generated"; exit 1; }
          echo "Primitive prefixes referenced by the generated code:"
          grep -oE '^HL_API [a-zA-Z_0-9*]+ +[a-z_0-9]+\(' out/hl/natives.h \
            | sed -E 's/^HL_API [^ ]+ +//; s/\($//' | sed -E 's/_.*//' \
            | sort | uniq -c | sort -rn

      - uses: actions/upload-artifact@v4
        with:
          name: hlc-sources
          path: out
          retention-days: 5

  # Stage 2a: the native build driven by cmake directly. Gradle is deliberately
  # not involved, so a native failure shows up as a plain cmake/ninja error
  # instead of buried in Gradle output. This duplicates the native compile the
  # apk job does anyway -- it is here because it is much the more readable of the
  # two, and can be dropped once this build has been green for a while.
  native:
    needs: haxe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: hlc-sources
          path: out

      - name: Resolve NDK and CMake versions
        run: .github/scripts/android-sdk-versions.sh

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Configure native build
        run: |
          "$CMAKE_BIN" \
            -S . -B build \
            -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$NINJA_BIN" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-$MIN_SDK"

      - name: Build native libraries
        run: |
          "$CMAKE_BIN" --build build

      - name: Show built libraries
        if: always()
        run: find build -name '*.so' -o -name '*.a' | sort

      - name: Upload native build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs
          path: |
            build/CMakeFiles/*.log
            build/CMakeCache.txt
          if-no-files-found: ignore

  # Stage 2b: the APK. This is the artifact the project exists to produce; there
  # is deliberately no local gradle path (see the Linux branch of the Makefile).
  apk:
    needs: haxe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: hlc-sources
          path: out

      # AGP 8.7 requires JDK 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve NDK and CMake versions
        run: .github/scripts/android-sdk-versions.sh

      # AGP would auto-download these, but doing it up front means a bad version
      # fails here with a clear message instead of mid-build.
      - name: Install NDK, CMake and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" \
            "platforms;android-$COMPILE_SDK"

      # Runs gradle directly rather than ./gradlew: the checked-in wrapper jar is
      # from Gradle 4.6 and no supported path in this repo uses it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug -p heaps-android-app --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heapsapp-debug
          path: heaps-android-app/heapsapp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload native build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-native-logs
          path: |
            heaps-android-app/heapsapp/.cxx/**/*.log
            heaps-android-app/heapsapp/build/reports
          if-no-files-found: ignore
